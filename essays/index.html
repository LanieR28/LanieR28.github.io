, "maker": "Mike Tonkin & Anna Liu\nTonkin Liu建筑事务所", "place": "英国 · 英格兰 · 兰开夏郡 Lancashire\n伯恩利 Burnley上方的奔宁山脉 Pennine hills"}, {"title": "海啸钢琴装置", "name": "IS YOUR TIME", "time": "2017年：东京ICC首展\n2011年：钢琴在东日本大地震海啸中受损", "maker": "坂本龙一 Ryuichi Sakamoto\n高谷史郎 Shiro Takatani", "place": "日本 · 东京 · NTT InterCommunication Center（ICC）：首展\n日本 · 宫城县 · 名取市 Natori：钢琴来源"}, {"title": "音乐公路", "name": "Melody Road（メロディーロード）", "time": "2004年10月：日本首条实验路段\n2008年：美国本田广告公路案例\n2018年：荷兰噪音投诉案例", "maker": "篠田兴业 Shinoda Kogyo｜日本实验路段的构想公司\nHonda（本田）｜美国广告案例", "place": "日本 · 北海道 · 标津町 Shibetsu：2004年实验路段\n美国 · 加州 · 兰开斯特 Lancaster：2008年广告路段\n荷兰 · 弗里斯兰省 Friesland：2018年投诉案例"}, {"title": "伦敦地铁线路图", "name": "London Tube Map by Harry Beck", "time": "1931年：绘制\n1932年：小规模试发\n1933年1月：正式发行", "maker": "Harry Beck｜伦敦地铁技术制图员", "place": "英国 · 伦敦 London\n美国 · 纽约 New York：文中1972—1979年类似抽象地图案例"}, {"title": "荷兰失智症村", "name": "De Hogeweyk（Dementia Village）", "time": "2009年：开放\n2018年：新增四栋住宅", "maker": "Yvonne van Amerongen / Jannette Spiering / Eloy van Hal｜概念创始团队\nVivium Care Group｜所属照护机构", "place": "荷兰 · 韦斯普 Weesp · 阿姆斯特丹附近", "extra": "制作人信息补充自项目团队官网", "url": "https://www.bethecareconcept.com/en/about-be-advice/"}]</script>
<script>
(()=>{
'use strict';
const cases=JSON.parse(document.querySelector('#case-data').textContent).map((c,i)=>({...c,id:i+1}));
const fields=[['name','英文名称'],['time','时间'],['maker','制作人 / 公司'],['place','地点']];
const shown=new Set();let order=cases.map(c=>c.id),random=false;
const list=document.querySelector('#cases'),search=document.querySelector('#search');
function status(){document.querySelector('#status').textContent=`已揭晓 ${shown.size} 项`;}
function render(){
 list.replaceChildren();let count=0;
 for(const id of order){const c=cases[id-1];if(!c.title.includes(search.value.trim()))continue;count++;
 const row=document.createElement('article');row.className='case';row.dataset.case=String(id);
 const title=document.createElement('div');title.className='case-title';
 const number=document.createElement('span');number.className='number';number.textContent=String(id).padStart(2,'0');
 const heading=document.createElement('h2');heading.textContent=c.title;title.append(number,heading);row.append(title);
 for(const [field,label] of fields){
 const key=id+':'+field,button=document.createElement('button');button.type='button';button.className='answer';button.dataset.field=field;
 function paint(){const open=shown.has(key);button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',`${c.title}的${label}，${open?'点击重新遮住':'点击揭晓'}`);button.replaceChildren();
 const tag=document.createElement('span');tag.className='label';tag.textContent=label;button.append(tag);
 if(open){const answer=document.createElement('span');answer.className='answer-text';answer.textContent=c[field];button.append(answer);}
 else {const mask=document.createElement('span');mask.className='placeholder';const text=document.createElement('span');text.textContent='点击揭晓';const plus=document.createElement('span');plus.textContent='＋';plus.setAttribute('aria-hidden','true');mask.append(text,plus);button.append(mask);}}
 button.addEventListener('click',()=>{shown.has(key)?shown.delete(key):shown.add(key);paint();const extra=row.querySelector('.extra');if(extra)extra.hidden=!(shown.has(id+':maker')||shown.has(id+':place'));status();});paint();row.append(button);
 }
 if(c.extra){const note=document.createElement('div');note.className='extra';note.hidden=!(shown.has(id+':maker')||shown.has(id+':place'));const link=document.createElement('a');link.href=c.url;link.target='_blank';link.rel='noopener';link.textContent=c.extra;note.append(link);row.append(note);}
 list.append(row);
 }
 document.querySelector('#empty').hidden=count>0;document.querySelector('#total').textContent=count;status();
}
document.querySelector('#reset').onclick=()=>{shown.clear();render();document.querySelector('#live').textContent='所有答案已遮住。'};
document.querySelector('#shuffle').onclick=()=>{shown.clear();random=!random;order=cases.map(c=>c.id);if(random)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}document.querySelector('#shuffle').textContent=random?'恢复原顺序':'打乱顺序';render();};
search.addEventListener('input',render);render();
})();
</script></body></html>
