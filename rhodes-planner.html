<script>
const DATA=JSON.parse(document.getElementById('data').textContent), KEY='rhodes-planner-v1';
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){document.getElementById('status').textContent='存储不可用，请导出记录'}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function task(text,id,done){return '<label class="task"><input type="checkbox" data-id="'+id+'" '+((state[id]??done)?'checked':'')+'><span>'+inline(text)+'</span></label>'}
function renderMd(arr,target,prefix){let out='';arr.forEach((b,i)=>{b.split('\n').forEach((line,j)=>{if(/^#+ /.test(line))out+='<h3 class="group-title">'+inline(line.replace(/^#+ /,''))+'</h3>';else if(/^- \[[ x]\] /.test(line))out+=task(line.slice(6),prefix+'-'+i+'-'+j,line[3]==='x');else if(line.trim())out+='<p class="note">'+inline(line)+'</p>'})});document.getElementById(target).innerHTML=out}
renderMd(DATA.plan,'plan-body','plan');renderMd(DATA.events,'events-body','event');renderMd(DATA.extra,'extras','extra');
let lastCost=null,lastRank=0;
document.getElementById('pack-body').innerHTML=DATA.packs.map((p,i)=>{let cost=p.price/p.draws;if(lastCost===null||Math.abs(cost-lastCost)>1e-8)lastRank=i+1;lastCost=cost;const id='pack-'+p.name;return '<article class="pack '+(i<3?'best':'')+'"><div class="pack-title"><input aria-label="标记'+esc(p.name)+'已购买" data-id="'+esc(id)+'" type="checkbox" '+(state[id]?'checked':'')+'><div><strong><span class="rank">'+String(lastRank).padStart(2,'0')+'</span> '+esc(p.name)+'</strong><br><span class="tag '+(/月/.test(p.type)?'month':/双倍/.test(p.type)?'double':'')+'">'+p.type+'</span></div></div><div class="metrics"><div><strong>¥'+p.price+'</strong><small> / 份</small></div><div><strong>'+Number(p.draws.toFixed(2))+'</strong><small> 抽</small></div><div><strong>'+cost.toFixed(2)+'</strong><small> 元/抽</small></div></div><p>'+esc(p.main)+'</p><details><summary>附加内容</summary><p>'+esc(p.extra)+'</p></details></article>'}).join('');
function update(){const q=document.getElementById('search').value.toLowerCase(),hide=document.getElementById('hide').checked;document.querySelectorAll('.task,.pack').forEach(el=>{const done=el.querySelector('input').checked;el.classList.toggle('done',done);el.classList.toggle('hidden',(hide&&done)||(q&&!el.textContent.toLowerCase().includes(q)))});document.querySelectorAll('.column').forEach(col=>{const all=[...col.querySelectorAll('[data-id]')];col.querySelector('.counter').textContent=all.filter(x=>x.checked).length+' / '+all.length})}
document.addEventListener('change',e=>{if(e.target.dataset.id){state[e.target.dataset.id]=e.target.checked;try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('status').textContent='已自动保存'}catch(err){document.getElementById('status').textContent='请导出记录保存'}}update()});document.getElementById('search').addEventListener('input',update);
document.getElementById('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'}));a.href=url;a.download='罗德岛计划台-勾选记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('import').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.version!==1||!d.state||typeof d.state!=='object')throw Error();for(const [k,v] of Object.entries(d.state)){if(typeof v==='boolean')state[k]=v}localStorage.setItem(KEY,JSON.stringify(state));document.querySelectorAll('[data-id]').forEach(x=>x.checked=!!state[x.dataset.id]);update();document.getElementById('status').textContent='记录已导入'}catch(err){document.getElementById('status').textContent='导入失败，请选择导出的记录文件'}};
update();
</script></body></html>
